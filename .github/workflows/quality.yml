name: BOSQYN AI - Python tests and JS syntax

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Python
        run: python -m compileall -q backend
      - name: Test Python API and evaluation
        run: python -m unittest discover -s backend/tests -v
      - name: Validate frontend JavaScript syntax
        run: |
          for file in frontend/js/*.js frontend/js/pages/*.js; do
            node --check "$file"
          done

      - name: Validate uploaded Teachable Machine archive
        run: python -m backend.vision_model
